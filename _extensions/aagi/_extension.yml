title: AAGIQuarto
author: Adam H. Sparks, James J. Balamuta, Russell Edson, Vinh Thiem Ma, Rose Megirian, Zhanglong Cao, Sam Rogers, Julian Taylor, Peter Misiun, William Pincombe
version: 2.0.1
quarto-required: ">=1.4.0 <2.0.0"

contributes:
  formats:
    # -------------------------
    # RevealJS
    # -------------------------
    revealjs:
      theme: default
      css:
        - revealjs/aagi.scss
      embed-resources: true
      highlight-style: breeze
      format-resources:
        - assets/AAGI_logo.svg
        - assets/title-slide-main.png
        - assets/fonts/FiraCode-Bold.woff2
        - assets/fonts/FiraCode-Light.woff2
        - assets/fonts/FiraCode-Medium.woff2
        - assets/fonts/FiraCode-Regular.woff2
        - assets/fonts/FiraCode-VF.woff2
        - assets/fonts/FiraCode-Bold.ttf
        - assets/fonts/FiraCode-Light.ttf
        - assets/fonts/FiraCode-Medium.ttf
        - assets/fonts/FiraCode-Regular.ttf
        - assets/fonts/FiraCode-Retina.ttf
      logo: AAGI_logo.svg
      title-slide-attributes:
        data-background-image: title-slide-main.png
        data-background-size: 1050px auto
        data-background-position: 50% 85%
      date-format: long
      slide-number: true
      footer: ""
      overview: true
      progress: true
      touch: true
      chalkboard: false
      execute:
        echo: true

    # -------------------------
    # FULL REPORT
    # -------------------------
    pdf+report:
      template: pdf-report/template.tex
      pdf-engine: xelatex
      highlight-style: breeze
      csl: assets/biometrics.csl
      fig-format: pdf
      fig-pos: H
      number-sections: true
      toc: true
      knitr:
        opts_chunk:
          fig.width: 6.3
          fig.height: 4
          out.width: "\\linewidth"
          fig.align: center
      resource-path:
        - .
        - assets
      format-resources:
        - assets/**
        - templates/**

    # -------------------------
    # SHORT REPORT
    # -------------------------
    pdf+shortreport:
      template: pdf-short-report/template.tex
      pdf-engine: xelatex
      highlight-style: breeze
      toc: false
      number-sections: false
      resource-path:
        - .
        - assets
      fig-format: pdf
      fig-pos: H
      csl: assets/biometrics.csl
      knitr:
        opts_chunk:
          fig.width: 6.3
          fig.height: 4
          out.width: "\\linewidth"
          fig.align: center
      format-resources:
        - assets/**
        - templates/**

    # -------------------------
    # DOCX
    # -------------------------
    docx+report:
      reference-doc: docx-report/template.docx
      toc: true
      highlight-style: breeze

    docx+shortreport:
      reference-doc: docx-short-report/template.docx
      highlight-style: breeze

    # -------------------------
    # PPTX
    # -------------------------
    pptx:
      reference-doc: pptx/template.pptx
      toc: true
      number-sections: false
      incremental: true
      highlight-style: breeze

    # -------------------------
    # HTML
    # -------------------------
    html+report:
      theme:
        - none
        - html/aagi-html.scss
      highlight-style: breeze
      toc: true
      toc-depth: 3
      number-sections: true
      embed-resources: true
      format-resources:
        - assets/AAGI_logo.svg
        - assets/AAGI_SP_Logo_Block-Portrait.svg
        - assets/fonts/FiraCode-Regular.woff2
        - assets/fonts/FiraCode-Medium.woff2
        - assets/fonts/FiraCode-Bold.woff2

    html+shortreport:
      theme:
        - none
        - html/aagi-html.scss
      highlight-style: breeze
      toc: false
      number-sections: false
      embed-resources: true
      format-resources:
        - assets/AAGI_logo.svg
        - assets/AAGI_SP_Logo_Block-Portrait.svg
        - assets/fonts/FiraCode-Regular.woff2
        - assets/fonts/FiraCode-Medium.woff2
        - assets/fonts/FiraCode-Bold.woff2

  resources:
    - assets/**
